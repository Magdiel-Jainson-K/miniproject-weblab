<!DOCTYPE html>
<html>
<head>
    <title>Smart Search Engine</title>
</head>

<body>

<div style="width:100%; background-color:#1e3a8a; padding:20px; overflow:hidden; box-sizing:border-box;">

    <div style="float:left; width:25%;">
        <h2 style="color:white; margin:8px 0;">
            Smart Search Engine
        </h2>
    </div>

    <div style="float:right; width:75%; text-align:right;">

        <input type="text"
        placeholder="Search products, services, or articles..."
        style="padding:8px; width:250px; border-radius:8px; border:1px solid gray;">

        <select style="padding:8px; border-radius:8px;">
            <option>All Categories</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>Clothing</option>
            <option>Groceries</option>
        </select>

        <select style="padding:8px; border-radius:8px;">
            <option>Any Price</option>
            <option>Under ₹500</option>
            <option>₹500 – ₹2,000</option>
            <option>Above ₹2,000</option>
        </select>

        <button
        style="padding:8px 18px; background-color:#28a745; color:white; border:none; border-radius:8px;"
        onmouseover="this.style.backgroundColor='#218838'"
        onmouseout="this.style.backgroundColor='#28a745'">
            Search
        </button>

    </div>

</div>

</body>
</html>
