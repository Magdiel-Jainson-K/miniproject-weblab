<!DOCTYPE html>
<html>
<head>
    <title>GameZone - MLBB</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        header{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            background:#09111f;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:15px 60px;
            z-index:1000;
        }

        .logo{
            color:#ffd700;
            font-size:30px;
            font-weight:bold;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 18px;
            font-size:18px;
            transition:0.3s;
        }

        nav a:hover{
            color:#00c8ff;
        }

        .playbtn{
            background:#ff9800;
            color:white;
            text-decoration:none;
            padding:12px 24px;
            border-radius:30px;
            transition:0.3s;
        }

        .playbtn:hover{
            background:#ffd700;
            color:black;
        }

        .banner{
            height:70vh;
            background:url("images/mlbb.jpg") no-repeat center center;
            background-size:cover;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            margin-top:75px;
        }

        .content{
            background:rgba(0,0,0,0.55);
            padding:40px;
            border-radius:15px;
        }

        .content h1{
            color:white;
            font-size:52px;
            margin-bottom:15px;
        }

        .content p{
            color:white;
            font-size:22px;
            margin-bottom:30px;
        }

        .explore{
            background:#00bfff;
            color:white;
            text-decoration:none;
            padding:15px 35px;
            border-radius:35px;
            font-size:18px;
            transition:0.3s;
        }

        .explore:hover{
            background:#ffd700;
            color:black;
        }

    </style>

</head>

<body>

<header>

<div class="logo">
GameZone
</div>

<nav>
<a href="#">Home</a>
<a href="#">Games</a>
<a href="#">Tournaments</a>
<a href="#">News</a>
<a href="#">Contact</a>
</nav>

<a href="#" class="playbtn">Play Now</a>

</header>

<section class="banner">

<div class="content">

<h1>Level Up Your Gaming Experience</h1>

<p>Join exciting tournaments and explore the latest games.</p>

<a href="#" class="explore">Explore Games</a>

</div>

</section>

</body>
</html>
