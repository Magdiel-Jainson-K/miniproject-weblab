<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #dbeafe, #c7d2fe);
            margin: 0;
            padding: 40px;
        }

        .container {
            width: 450px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #3730a3;
            margin-bottom: 25px;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #374151;
        }

        input[type="text"] {
            width: 100%;
            padding: 11px;
            border: 1px solid #aaa;
            border-radius: 6px;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #4f46e5;
        }

        .options {
            display: flex;
            gap: 18px;
            padding: 10px;
            background-color: #f5f7ff;
            border-radius: 6px;
        }

        .options label {
            font-weight: normal;
            margin: 0;
        }

        .options input {
            accent-color: #4f46e5;
        }

        .error {
            color: red;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background-color: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #3730a3;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 7px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .success {
            background-color: #dcfce7;
            color: #166534;
            border: 1px solid #86efac;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Student Registration</h1>

        <form id="registrationForm">

            <div class="field">

                <label for="studentName">
                    Student Name
                </label>

                <input
                    type="text"
                    id="studentName"
                    placeholder="Enter your name">

                <div id="nameError" class="error"></div>

            </div>


            <div class="field">

                <label for="email">
                    Email ID
                </label>

                <input
                    type="text"
                    id="email"
                    placeholder="example@gmail.com">

                <div id="emailError" class="error"></div>

            </div>


            <div class="field">

                <label>Gender</label>

                <div class="options">

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Male">
                        Male
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Female">
                        Female
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="gender"
                            value="Other">
                        Other
                    </label>

                </div>

                <div id="genderError" class="error"></div>

            </div>


            <div class="field">

                <label>Skills</label>

                <div class="options">

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="HTML">
                        HTML
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="CSS">
                        CSS
                    </label>

                    <label>
                        <input
                            type="checkbox"
                            name="skills"
                            value="JavaScript">
                        JavaScript
                    </label>

                </div>

                <div id="skillError" class="error"></div>

            </div>


            <button type="submit">
                Register
            </button>

        </form>


        <div id="result"></div>

    </div>


    <script>

        document.getElementById("registrationForm").addEventListener("submit", function(event) {

            event.preventDefault();

            let name = document.getElementById("studentName").value.trim();

            let email = document.getElementById("email").value.trim();

            let gender = document.querySelector(
                'input[name="gender"]:checked'
            );

            let skills = document.querySelectorAll(
                'input[name="skills"]:checked'
            );


            document.getElementById("nameError").innerHTML = "";
            document.getElementById("emailError").innerHTML = "";
            document.getElementById("genderError").innerHTML = "";
            document.getElementById("skillError").innerHTML = "";

            document.getElementById("result").style.display = "none";


            let valid = true;


            let namePattern = /^[A-Za-z ]+$/;

            if (name === "") {

                document.getElementById("nameError").innerHTML =
                    "Student name is required.";

                valid = false;

            } else if (!namePattern.test(name)) {

                document.getElementById("nameError").innerHTML =
                    "Name should contain only alphabets and spaces.";

                valid = false;
            }


            let emailPattern =
                /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$/;

            if (email === "") {

                document.getElementById("emailError").innerHTML =
                    "Email ID is required.";

                valid = false;

            } else if (!emailPattern.test(email)) {

                document.getElementById("emailError").innerHTML =
                    "Please enter a valid email address.";

                valid = false;
            }


            if (gender === null) {

                document.getElementById("genderError").innerHTML =
                    "Please select a gender.";

                valid = false;
            }


            if (skills.length === 0) {

                document.getElementById("skillError").innerHTML =
                    "Please select at least one skill.";

                valid = false;
            }


            if (valid) {

                let result = document.getElementById("result");

                result.innerHTML = "Registration Successful.";

                result.className = "success";

                result.style.display = "block";

            }

        });

    </script>

</body>
</html>
